# manifiesto del juego. el id es el nombre de la carpeta (games/cruzar).
[game]
title    = "Cruzar"
author   = "Jona"
year     = 2026
width    = 240
height   = 208
blurb    = "salta entre autos, motos, trenes y troncos: cada cruce es un tramo nuevo y más rápido"
controls = "flechas o wasd saltan · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "4"
swipe   = "once"               # deslizar salta: un salto por gesto
hint    = "o desliza sobre el juego para saltar"
