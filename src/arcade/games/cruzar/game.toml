# manifiesto del juego. el id es el nombre de la carpeta (games/cruzar).
[game]
title    = "Cruzar"
author   = "Jona"
year     = 2026
width    = 240
height   = 208
blurb    = "tráfico abajo, cintas arriba, y cada cruce acelera la calle: juntá monedas al pasar"
controls = "flechas o wasd mueven · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "4"
swipe   = true                  # deslizar sobre la pantalla también salta
hint    = "o desliza el dedo sobre la pantalla"
