# manifiesto del juego. el id es el nombre de la carpeta (games/esquiva).
[game]
title    = "Esquiva"
author   = "Jona"
year     = 2026
width    = 240
height   = 360
blurb    = "aguanta 100 segundos: oleadas, muros, rayos y un jefe final. las balas se recargan solas"
controls = "flechas o mouse mueven · espacio dispara (mantén para disparar seguido) · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad "drag": un trackpad. el dedo se arrastra abajo y la nave se mueve
# arriba, sin taparla. con teclado siguen las flechas.
[game.touch]
pad     = "drag"
buttons = [["fuego", "space"]]
hint    = "arrastra para moverte · mantén fuego: las balas se recargan solas"
