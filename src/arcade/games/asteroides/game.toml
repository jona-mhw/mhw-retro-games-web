# manifiesto del juego. el id es el nombre de la carpeta (games/asteroides).
[game]
title    = "Asteroides"
author   = "Jona"
year     = 2026
width    = 256
height   = 208
blurb    = "vectores e inercia: las piedras se parten, las seguidas hacen combo y la dorada se escapa"
controls = "izq/der giran · arriba empuja · espacio dispara · abajo frena"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "lr"                  # izq/der giran la nave
buttons = [["fuego", "space"], ["empuje", "up"], ["freno", "down"]]
