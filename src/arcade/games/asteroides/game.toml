# manifiesto del juego. el id es el nombre de la carpeta (games/asteroides).
[game]
title    = "Asteroides"
author   = "Jona"
year     = 2026
width    = 256
height   = 208
blurb    = "oleadas de piedra, minas que estallan en cadena, cometas y una tormenta final"
controls = "izq/der giran · arriba empuja · abajo frena · espacio dispara (mantén) · c auto-fuego"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# en el celular el auto-fuego arranca prendido: ◀ ▶ con un pulgar, empuje y
# freno con el otro. "auto" lo apaga o lo prende.
[game.touch]
pad     = "lr"                  # izq/der giran la nave
buttons = [["fuego", "space"], ["empuje", "up"], ["freno", "down"], ["auto", "c"]]
hint    = "auto-fuego prendido: gira y empuja · auto lo apaga"
