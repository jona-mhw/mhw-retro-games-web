# manifiesto del juego. el id es el nombre de la carpeta (games/pong).
[game]
title    = "Pong"
author   = "Jona"
year     = 2026
width    = 220
height   = 170
blurb    = "90 segundos contra la máquina: pegale con efecto, apuntá a las cajas y sostené la racha"
controls = "mouse o flechas mueven · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "ud"
hint    = "o arrastra el dedo sobre la cancha"
