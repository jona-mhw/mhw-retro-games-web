# manifiesto del juego. el id es el nombre de la carpeta (games/bloques).
[game]
title    = "Bloques"
author   = "Jona"
year     = 2026
width    = 240
height   = 380
blurb    = "tetris blitz: 100 segundos, combos, piezas doradas y fiebre x2 al final. se juega con el dedo sobre el tablero"
controls = "flechas · arriba gira · espacio cae · c guarda · z ítem · mouse: clic gira, arrastra mueve · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "4"                   # arriba gira, abajo baja suave
buttons = [["caer", "space"], ["guardar", "c"], ["ítem", "z"]]
# sin swipe a propósito: el juego lee el dedo sobre la pantalla (el mouse de
# pyxel) y arma sus propios gestos. con swipe = true cada arrastre apretaría
# además una flecha y la pieza se movería el doble.
hint    = "en la pantalla: toca gira · arrastra mueve · desliza ▼ cae · ▲ guarda"
