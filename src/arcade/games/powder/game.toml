# manifiesto del juego. el emulador lo lee para el menú y los créditos.
# el id del juego es el nombre de la carpeta (games/powder), no va acá.
[game]
module   = "games.powder"
title    = "Powder"
author   = "Jona"
year     = 2026
width    = 320
height   = 240
blurb    = "17 materiales que caen, arden, fluyen, salpican y hacen circuitos"
controls = "click pinta · rueda pincel · 1-0 material · espacio pausa · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "none"                # se pinta con el dedo
buttons = [["pausa", "space"], ["pincel +", "wheelup"], ["pincel −", "wheeldown"],
           ["vaciar", "c"], ["escena", "r"], ["ayuda", "h"]]
hint    = "pinta con el dedo · toca la barra para elegir material"
