# manifiesto del juego. el emulador lo lee para el menú y los créditos.
# el id del juego es el nombre de la carpeta (games/powder), no va acá.
[game]
module   = "games.powder"
title    = "Powder"
author   = "Jona"
year     = 2026
width    = 320
height   = 240
blurb    = "23 materiales que caen, arden y fluyen: cohetes, virus, rayos, clonador y un agujero negro"
controls = "click pinta · der borra · rueda o z pincel · x deshace · 1-0 o tab material · espacio pausa · h menú · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# se pinta con el dedo sobre la pantalla y el material se elige en la barra
# de abajo (pestañas por categoría). vaciar y cambiar de escena están en el
# menú, que se abre con su botón.
[game.touch]
pad     = "none"                # se pinta con el dedo
buttons = [["pincel", "z"], ["deshacer", "x"], ["pausa", "space"], ["menú", "h"]]
hint    = "pinta con el dedo · elige el material en las pestañas de abajo"
