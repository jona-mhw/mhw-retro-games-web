# manifiesto del juego. el id es el nombre de la carpeta (games/autos).
[game]
title    = "Autos"
author   = "Jona"
year     = 2026
width    = 256
height   = 384
blurb    = "gta 2 en 90 segundos: levanta fajos, cumple misiones, derrapa, salta rampas y escapa de 5 estrellas"
controls = "flechas o wasd manejan · freno + doblar = derrape · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# en el celular el auto acelera solo (game.py: con_dedo), así que basta el
# freno: frenar a fondo es reversa, y frenar doblando a velocidad, derrape.
[game.touch]
pad     = "lr"                  # izq/der doblan
buttons = [["freno", "down"]]
hint    = "acelera solo · ◀ ▶ doblan · freno + doblar = derrape"
