# manifiesto del juego. el id es el nombre de la carpeta (games/autos).
[game]
title    = "Autos"
author   = "Jona"
year     = 2026
width    = 384
height   = 288
blurb    = "gta 2 en 90 segundos: levantá fajos, esquivá patrullas y pasá por el banco a guardarlos"
controls = "flechas o wasd manejan · esc salir"

# controles táctiles (celular): los dibuja index.html bajo la pantalla.
# pad: "4" cruceta, "lr" izq/der, "ud" arriba/abajo, "none" sin pad.
# buttons: [nombre, tecla]; la tecla es la del teclado que el botón aprieta.
[game.touch]
pad     = "lr"                  # izq/der doblan
buttons = [["acelerar", "up"], ["reversa", "down"]]
