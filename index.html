<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MHW · RETRO · FUTURE</title>
  <meta name="description" content="un cabinet de juegos pixel art hechos con pyxel, para jugar en el celular">
  <meta name="theme-color" content="#0B0A16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MHW Arcade">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.9/wasm/pyxel.js"></script>
  <style>
    :root {
      --bg: #0B0A16; --panel: #161228; --sel: #241B44; --line: #3A2C63;
      --dim: #6E6499; --txt: #D8DEEC; --acc: #38E8E0; --pink: #E868C8;
      --amber: #FFC24A;
      --bar-h: 44px;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--txt);
      overflow: hidden; overscroll-behavior: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: var(--mono);
    }
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* la barra de arriba: volver (esc) y pantalla completa */
    #bar {
      flex: 0 0 auto; display: none; align-items: center; gap: 8px;
      height: var(--bar-h); padding: env(safe-area-inset-top) 10px 0;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    #bar .title { flex: 1; text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--acc); }
    #bar button {
      height: 32px; min-width: 44px; padding: 0 12px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--txt);
      font: 600 13px var(--mono);
    }
    #bar button.on { background: var(--sel); border-color: var(--acc); }

    /* la pantalla de pyxel: pyxel.css la quiere a página completa, acá vive
       en su caja y deja lugar a los controles */
    body div#pyxel-screen {
      position: relative; flex: 1 1 auto; width: 100%; height: auto;
      min-height: 0; background: var(--bg);
    }

    /* los controles táctiles: abajo en vertical, a los costados en horizontal */
    #controls {
      flex: 1 1 auto; display: none; flex-direction: column; min-height: 0;
      padding: 6px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: var(--panel);
    }
    #hint { min-height: 16px; text-align: center; font-size: 11px; color: var(--dim); }
    #clusters { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cluster { display: flex; align-items: center; justify-content: center; }
    #right { flex-wrap: wrap; gap: 10px; max-width: 58%; justify-content: flex-end; }
    /* sin pad (powder): los botones en grilla, a todo el ancho */
    #clusters.nopad #left { display: none; }
    #clusters.nopad #right { max-width: none; width: 100%; display: grid;
                             grid-template-columns: repeat(3, 1fr); justify-items: center; }

    .btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid var(--line); background: var(--sel); color: var(--txt);
      font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .04em;
      box-shadow: 0 3px 0 #060512;
    }
    .btn small { font-weight: 400; font-size: 9px; color: var(--dim); text-transform: none; margin-top: 2px; }
    .btn.main { width: 88px; height: 88px; border-color: var(--acc); color: var(--acc); }
    .btn.wide { width: 96px; height: 52px; border-radius: 12px; }
    .btn.down, .pad .arm.down { background: var(--line); transform: translateY(2px); box-shadow: none; }

    /* el pad: una sola pieza que sigue al dedo, así se puede deslizar de una
       dirección a otra sin levantarlo */
    .pad { position: relative; display: grid; gap: 4px; }
    .pad .arm {
      display: flex; align-items: center; justify-content: center;
      background: var(--sel); border: 2px solid var(--line); border-radius: 10px;
      color: var(--txt); font-size: 22px; box-shadow: 0 3px 0 #060512;
    }
    .pad.p4 { grid-template: repeat(3, 56px) / repeat(3, 56px); }
    .pad.p4 .u { grid-area: 1 / 2; } .pad.p4 .l { grid-area: 2 / 1; }
    .pad.p4 .r { grid-area: 2 / 3; } .pad.p4 .d { grid-area: 3 / 2; }
    .pad.p4 .hub { grid-area: 2 / 2; border-radius: 50%; background: var(--panel); }
    .pad.lr { grid-template: 76px / 84px 84px; gap: 8px; }
    .pad.ud { grid-template: 72px 72px / 96px; gap: 8px; }

    /* el trackpad: se arrastra acá abajo y la nave se mueve allá arriba, sin
       que el dedo tape el juego (como los shooters de celular) */
    #clusters.drag #left { flex: 1; align-self: stretch; }
    .trackpad {
      flex: 1; align-self: stretch; min-height: 120px; border-radius: 18px;
      border: 2px dashed var(--line); background: rgba(36, 27, 68, .45);
      display: flex; align-items: center; justify-content: center;
      color: var(--dim); font-size: 11px; letter-spacing: .15em; text-align: center;
    }
    .trackpad.down { border-color: var(--acc); color: var(--acc); }

    body.touch #bar { display: flex; }
    body.touch #controls { display: flex; }

    /* celular acostado: la pantalla al centro y los controles a los lados,
       sobre los márgenes que deja el juego */
    @media (orientation: landscape) and (max-height: 520px) {
      body.touch #controls {
        position: fixed; inset: var(--bar-h) 0 0 0; padding: 0 10px 10px;
        background: none; border: 0; pointer-events: none;
      }
      body.touch #hint { display: none; }
      body.touch #clusters { align-items: flex-end; }
      body.touch .cluster > * { pointer-events: auto; }
      body.touch #right { max-width: 30%; }
      body.touch .btn, body.touch .pad .arm { opacity: .85; }
      body.touch .btn { width: 60px; height: 60px; font-size: 11px; }
      body.touch .btn.main { width: 72px; height: 72px; }
      body.touch .btn.wide { width: 84px; height: 44px; }
      body.touch #clusters.nopad #right { display: flex; flex-direction: column; width: auto;
                                          margin-left: auto; align-items: flex-end; }
      body.touch .pad.p4 { grid-template: repeat(3, 50px) / repeat(3, 50px); }
      body.touch .pad.lr { grid-template: 64px / 70px 70px; }
    }

    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 10;
      color: var(--acc); background: var(--bg); pointer-events: none;
      font: 14px/1.4 var(--mono); letter-spacing: .35em; text-align: center; padding: 0 16px;
    }
    #boot small { color: var(--dim); letter-spacing: .1em; }
    #boot.gone { display: none; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="back" data-key="esc">◀ volver</button>
    <div class="title">MHW · RETRO</div>
    <button id="fs" aria-label="pantalla completa">⛶</button>
  </div>
  <div id="pyxel-screen"></div>
  <div id="controls">
    <div id="hint"></div>
    <div id="clusters">
      <div class="cluster" id="left"></div>
      <div class="cluster" id="right"></div>
    </div>
  </div>
  <div id="boot">
    <div>M H W &nbsp; R E T R O &nbsp; F U T U R E</div>
    <small id="boot-msg">cargando el cabinet…</small>
  </div>
  <script>
    // ---------------------------------------------------------------------
    // teclas: cada botón táctil aprieta una tecla de verdad (un KeyboardEvent
    // que pyxel lee igual que el teclado), así los juegos no cambian.
    const KEYS = {
      up: ["ArrowUp", "ArrowUp", 38], down: ["ArrowDown", "ArrowDown", 40],
      left: ["ArrowLeft", "ArrowLeft", 37], right: ["ArrowRight", "ArrowRight", 39],
      space: [" ", "Space", 32], enter: ["Enter", "Enter", 13], esc: ["Escape", "Escape", 27],
      x: ["x", "KeyX", 88], c: ["c", "KeyC", 67], z: ["z", "KeyZ", 90],
      r: ["r", "KeyR", 82], h: ["h", "KeyH", 72], tab: ["Tab", "Tab", 9],
    };
    const KEY_LABEL = { space: "espacio", enter: "enter", esc: "esc", up: "▲", down: "▼",
                        left: "◀", right: "▶", wheelup: "rueda", wheeldown: "rueda" };
    const held = {};   // tecla -> cuántos dedos la sostienen

    function sendKey(name, down) {
      const k = KEYS[name];
      if (!k) return;
      const ev = new KeyboardEvent(down ? "keydown" : "keyup",
                                   { key: k[0], code: k[1], bubbles: true, cancelable: true });
      Object.defineProperty(ev, "keyCode", { get: () => k[2] });
      Object.defineProperty(ev, "which", { get: () => k[2] });
      document.dispatchEvent(ev);
    }

    function press(name) {
      if (name === "wheelup" || name === "wheeldown") {   // el pincel de powder
        const canvas = document.querySelector("canvas#canvas");
        canvas && canvas.dispatchEvent(new WheelEvent("wheel", {
          deltaY: name === "wheelup" ? -100 : 100, bubbles: true, cancelable: true }));
      } else {
        held[name] = (held[name] || 0) + 1;
        if (held[name] === 1) sendKey(name, true);
      }
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function release(name) {
      if (!held[name]) return;
      held[name] -= 1;
      if (held[name] === 0) sendKey(name, false);
    }

    function releaseAll() {
      for (const name in held) { if (held[name]) { held[name] = 0; sendKey(name, false); } }
      document.querySelectorAll(".down").forEach(e => e.classList.remove("down"));
    }
    document.addEventListener("visibilitychange", releaseAll);
    window.addEventListener("blur", releaseAll);

    // un botón que se mantiene apretado mientras el dedo está encima
    function holdButton(el, name) {
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        el.classList.add("down");
        press(name);
      });
      const up = () => {
        if (!el.classList.contains("down")) return;
        el.classList.remove("down");
        release(name);
      };
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
      el.addEventListener("lostpointercapture", up);
    }

    // el pad sigue al dedo: la dirección sale de dónde está respecto del
    // centro, y cambia sin levantarlo. axes: "xy" (cruceta), "x" o "y".
    function makePad(kind) {
      const pad = document.createElement("div");
      const arms = { p4: [["u", "up", "▲"], ["l", "left", "◀"], ["r", "right", "▶"], ["d", "down", "▼"]],
                     lr: [["l", "left", "◀"], ["r", "right", "▶"]],
                     ud: [["u", "up", "▲"], ["d", "down", "▼"]] }[kind];
      pad.className = "pad " + kind;
      const el = {};
      for (const [cls, key, glyph] of arms) {
        const a = document.createElement("div");
        a.className = "arm " + cls;
        a.textContent = glyph;
        pad.appendChild(a);
        el[key] = a;
      }
      if (kind === "p4") {
        const hub = document.createElement("div");
        hub.className = "arm hub";
        pad.appendChild(hub);
      }
      let cur = null;
      const set = dir => {
        if (dir === cur) return;
        if (cur) { el[cur].classList.remove("down"); release(cur); }
        cur = dir;
        if (cur) { el[cur].classList.add("down"); press(cur); }
      };
      const track = e => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < 12) return set(null);
        if (kind === "lr") return set(dx < 0 ? "left" : "right");
        if (kind === "ud") return set(dy < 0 ? "up" : "down");
        set(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
      };
      pad.addEventListener("pointerdown", e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); track(e); });
      pad.addEventListener("pointermove", e => { if (pad.hasPointerCapture(e.pointerId)) track(e); });
      for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) {
        pad.addEventListener(t, () => set(null));
      }
      return pad;
    }

    // el trackpad: junta cuánto se arrastró (en píxeles del juego) hasta que
    // pixelkit.web.drag() lo pide. es movimiento relativo: no importa dónde
    // se apoye el dedo, importa cuánto se mueve.
    let dragAcc = [0, 0];
    window.mhwDrag = () => { const r = dragAcc; dragAcc = [0, 0]; return r[0].toFixed(2) + "," + r[1].toFixed(2); };
    function makeTrackpad() {
      const el = document.createElement("div");
      el.className = "trackpad";
      el.textContent = "arrastra aquí";
      let last = null;
      el.addEventListener("pointerdown", e => {
        e.preventDefault(); el.setPointerCapture(e.pointerId);
        last = [e.clientX, e.clientY]; el.classList.add("down");
      });
      el.addEventListener("pointermove", e => {
        if (!last) return;
        // cuántos píxeles del juego vale un píxel de pantalla, con algo de
        // ganancia para cruzar la pantalla sin levantar el dedo
        const r = screenEl.getBoundingClientRect();
        const drawn = Math.min(r.width, r.height * screenSize.w / screenSize.h);
        const k = 1.6 * screenSize.w / Math.max(1, drawn);
        dragAcc[0] += (e.clientX - last[0]) * k;
        dragAcc[1] += (e.clientY - last[1]) * k;
        last = [e.clientX, e.clientY];
      });
      const up = () => { last = null; el.classList.remove("down"); };
      for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(t, up);
      return el;
    }

    // deslizar sobre la pantalla = un toque de flecha (culebra, cruzar)
    let swipeOn = false, swipeOnce = false, swipeFrom = null;
    const swipeHeld = {};          // dirección -> timer del keyup pendiente
    const screenEl = document.getElementById("pyxel-screen");
    screenEl.addEventListener("pointerdown", e => { swipeFrom = [e.clientX, e.clientY]; });
    screenEl.addEventListener("pointermove", e => {
      if (!swipeOn || !swipeFrom) return;
      const dx = e.clientX - swipeFrom[0], dy = e.clientY - swipeFrom[1];
      if (Math.hypot(dx, dy) < 20) return;
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
      // si la misma flecha sigue apretada por el desliz anterior, se suelta
      // primero: si no, el segundo desliz no manda keydown y se pierde
      if (swipeHeld[dir]) { clearTimeout(swipeHeld[dir]); swipeHeld[dir] = 0; release(dir); }
      press(dir);
      swipeHeld[dir] = setTimeout(() => { swipeHeld[dir] = 0; release(dir); }, 60);
      // por defecto un gesto largo encadena giros (culebra); con
      // swipe = "once" es un salto por gesto (cruzar)
      swipeFrom = swipeOnce ? null : [e.clientX, e.clientY];
    });
    screenEl.addEventListener("pointerup", () => { swipeFrom = null; });

    // ---------------------------------------------------------------------
    // lo que pide pixelkit.web: qué controles mostrar y qué tamaño tiene el juego
    let screenSize = { w: 320, h: 240 };

    function layout() {
      const portrait = innerHeight > innerWidth || innerHeight > 520;
      const touch = document.body.classList.contains("touch");
      if (touch && portrait) {
        const bar = document.getElementById("bar").offsetHeight;
        const fit = innerWidth * screenSize.h / screenSize.w;
        const h = Math.max(160, Math.min(fit, innerHeight - bar - 230));
        screenEl.style.flex = "0 0 " + Math.round(h) + "px";
      } else {
        screenEl.style.flex = "";
      }
      window.dispatchEvent(new Event("resize"));
    }

    window.mhwTouch = (json) => {
      const spec = JSON.parse(json);
      screenSize = { w: spec.w, h: spec.h };
      releaseAll();
      const left = document.getElementById("left"), right = document.getElementById("right");
      left.replaceChildren();
      right.replaceChildren();
      dragAcc = [0, 0];
      if (spec.pad === "drag") left.appendChild(makeTrackpad());
      else if (spec.pad && spec.pad !== "none") left.appendChild(makePad(spec.pad === "4" ? "p4" : spec.pad));
      (spec.buttons || []).forEach(([label, key], i) => {
        const b = document.createElement("div");
        b.className = "btn" + (i === 0 ? " main" : "") + (spec.pad === "none" ? " wide" : "");
        b.textContent = label;
        const sub = document.createElement("small");
        sub.textContent = KEY_LABEL[key] || key;
        b.appendChild(sub);
        holdButton(b, key);
        right.appendChild(b);
      });
      document.getElementById("clusters").classList.toggle("nopad", !spec.pad || spec.pad === "none");
      document.getElementById("clusters").classList.toggle("drag", spec.pad === "drag");
      swipeOn = !!spec.swipe;
      swipeOnce = spec.swipe === "once";
      document.getElementById("hint").textContent = spec.hint || "";
      document.getElementById("back").textContent =
        { play: "⏸ pausa", pause: "◀ título" }[spec.scene] || "◀ volver";
      document.getElementById("boot").classList.add("gone");
      layout();
    };

    // cambiar de juego sin recargar la página: pyxel se reinicia con la url
    // nueva (main.py la lee). así la pantalla completa sigue puesta y pyodide
    // no se vuelve a bajar. si algo falla, se recarga como siempre.
    function relaunch() {
      releaseAll();
      const game = new URLSearchParams(location.search).get("game");
      document.getElementById("boot-msg").textContent = game ? "insertando cartucho: " + game + "…" : "volviendo al menú…";
      document.getElementById("boot").classList.remove("gone");
      if (typeof resetPyxel === "function" && window.pyxelContext && window.pyxelContext.initialized) {
        resetPyxel().catch(() => location.reload());
      } else {
        location.reload();
      }
    }
    window.mhwGo = (query) => {
      history.pushState(null, "", query || location.pathname);
      setTimeout(relaunch, 0);       // fuera del frame de pyxel que lo pidió
    };
    window.addEventListener("popstate", () => setTimeout(relaunch, 0));

    // ---------------------------------------------------------------------
    const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window
                    || new URLSearchParams(location.search).has("touch");
    if (isTouch) document.body.classList.add("touch");
    window.addEventListener("resize", e => { if (e.isTrusted) layout(); });
    // el menú se arma vertical o apaisado según cómo esté el teléfono: al
    // girarlo se rearma (los juegos tienen su tamaño fijo y sólo se reacomodan)
    let wasPortrait = innerHeight > innerWidth;
    window.addEventListener("orientationchange", () => setTimeout(() => {
      layout();
      const nowPortrait = innerHeight > innerWidth;
      if (isTouch && nowPortrait !== wasPortrait && !new URLSearchParams(location.search).get("game")) relaunch();
      wasPortrait = nowPortrait;
    }, 250));

    holdButton(document.getElementById("back"), "esc");
    const fs = document.getElementById("fs");
    const root = document.documentElement;
    if (!root.requestFullscreen) fs.style.visibility = "hidden";   // iphone: usar "agregar a inicio"
    fs.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else root.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
    });
    document.addEventListener("fullscreenchange", () => {
      fs.classList.toggle("on", !!document.fullscreenElement);
      setTimeout(layout, 100);
    });
    layout();

    // pyxel web pide un clic antes de arrancar (por el audio). el cabinet no
    // tiene sonido, así que el "click to start" se salta solo.
    const autoStart = setInterval(() => {
      const ctx = window.pyxelContext;
      if (ctx && ctx.resolveInput) { ctx.resolveInput(); clearInterval(autoStart); }
    }, 50);

    const game = new URLSearchParams(location.search).get("game");
    if (game) document.getElementById("boot-msg").textContent = "insertando cartucho: " + game + "…";

    launchPyxel({ command: "play", name: "arcade.pyxapp" });
  </script>
</body>
</html>
