# copia main a la rama gh-pages, que es la que publica GitHub Pages.
# así el sitio se actualiza solo con cada push a main.
name: publicar en gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
